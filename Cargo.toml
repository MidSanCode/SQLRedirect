[package]
name = "sqlredirect"
version = "0.1.0"
edition = "2021"
description = "Database compatibility proxy: simulate PostgreSQL/MySQL, translate SQL, forward to a target database"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
mysql-mimic = "0.9"
pgwire = { version = "0.40", default-features = false, features = ["server-api-ring"] }
serde = { version = "1", features = ["derive"] }
sqlparser = { version = "0.62", features = ["visitor"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "mysql", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Used by examples/demo.rs to connect through the proxy as a real client.
tokio-postgres = "0.7"

[profile.release]
lto = "thin"

[profile.dev]
debug = 0
incremental = false

[patch.crates-io]
mysql-mimic = { path = "vendor/mysql-mimic" }